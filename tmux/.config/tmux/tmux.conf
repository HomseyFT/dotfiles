# ── General ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on
set -g status-interval 5

# ── Prefix ────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Vi mode ───────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Pane splitting (intuitive keys) ──────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-style) ──────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ──────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r [ previous-window
bind -r ] next-window

# ── Reload config ────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Kanagawa theme ───────────────────────────────
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-left ""
set -g status-right-length 100
set -g status-right "#[fg=#957FB8] #S #[fg=#54546D]│#[fg=#7E9CD8]  #{b:pane_current_path} #[fg=#54546D]│#[fg=#E6C384] 󰥔 %H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg=#727169] #I #W "
set -g window-status-current-format "#[bg=#2D4F67,fg=#DCD7BA,bold] #I #W "
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#7E9CD8"
set -g message-style "bg=#2A2A37,fg=#DCD7BA"
set -g mode-style "bg=#2D4F67,fg=#C8C093"

# ── Plugins (tpm) ────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# ── Initialize tpm (MUST be last line) ───────────
# Plugins live outside the config dir so they stay out of the dotfiles repo
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
run '~/.local/share/tmux/plugins/tpm/tpm'
